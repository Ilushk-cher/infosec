<svg xmlns="http://www.w3.org/2000/svg" width="700" height="554" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Измерения свободного места при записи ADS</title>
  <desc id="desc">Верхний график сравнивает накопленный размер дополнительных потоков и уменьшение свободного места. Нижний график показывает округление размера каждого потока до кластеров NTFS по 4096 байт.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #263238; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; }
    .axis { stroke: #52636b; stroke-width: 1.3; }
    .grid { stroke: #d8e0e2; stroke-width: 1; }
    .tick { font-size: 12px; fill: #52636b; }
    .label { font-size: 14px; font-weight: 600; }
    .actual { fill: none; stroke: #007f78; stroke-width: 3; }
    .ideal { fill: none; stroke: #7b8790; stroke-width: 2; stroke-dasharray: 7 6; }
    .point { fill: #007f78; stroke: #fff; stroke-width: 1.2; }
    .bar { fill: #168c88; }
    .outlier { fill: #d15b38; }
  </style>
  <rect width="960" height="760" fill="#ffffff"/>
  <text x="48" y="38" class="title">NTFS ADS: размер данных и свободное место</text>
  <text x="48" y="61" class="subtitle">Windows 11, NTFS на отдельном томе L:, 20 ADS в 20 файлах, размеры от 997 до 100 663 291 байта</text>

  <text x="48" y="92" class="label">Накопленное уменьшение свободного места почти равно размеру записанных данных</text>
  <line x1="90" y1="100" x2="90" y2="400" class="axis"/>
  <line x1="90" y1="400" x2="880" y2="400" class="axis"/>
  <line x1="90" y1="340" x2="880" y2="340" class="grid"/>
  <line x1="90" y1="280" x2="880" y2="280" class="grid"/>
  <line x1="90" y1="220" x2="880" y2="220" class="grid"/>
  <line x1="90" y1="160" x2="880" y2="160" class="grid"/>
  <line x1="90" y1="100" x2="880" y2="100" class="grid"/>
  <line x1="248" y1="100" x2="248" y2="400" class="grid"/>
  <line x1="406" y1="100" x2="406" y2="400" class="grid"/>
  <line x1="564" y1="100" x2="564" y2="400" class="grid"/>
  <line x1="722" y1="100" x2="722" y2="400" class="grid"/>
  <line x1="880" y1="100" x2="880" y2="400" class="grid"/>
  <text x="77" y="404" text-anchor="end" class="tick">0</text>
  <text x="77" y="344" text-anchor="end" class="tick">64</text>
  <text x="77" y="284" text-anchor="end" class="tick">128</text>
  <text x="77" y="224" text-anchor="end" class="tick">192</text>
  <text x="77" y="164" text-anchor="end" class="tick">256</text>
  <text x="77" y="104" text-anchor="end" class="tick">320</text>
  <text x="90" y="420" text-anchor="middle" class="tick">0</text>
  <text x="248" y="420" text-anchor="middle" class="tick">64</text>
  <text x="406" y="420" text-anchor="middle" class="tick">128</text>
  <text x="564" y="420" text-anchor="middle" class="tick">192</text>
  <text x="722" y="420" text-anchor="middle" class="tick">256</text>
  <text x="880" y="420" text-anchor="middle" class="tick">320</text>
  <text x="485" y="447" text-anchor="middle" class="label">Накопленный размер ADS, МиБ</text>
  <text x="28" y="250" text-anchor="middle" class="label" transform="rotate(-90 28 250)">Уменьшение свободного места, МиБ</text>
  <line x1="646" y1="136" x2="683" y2="136" class="actual"/>
  <text x="691" y="140" class="tick">измерено</text>
  <line x1="774" y1="136" x2="811" y2="136" class="ideal"/>
  <text x="819" y="140" class="tick">идеал y = x</text>
  <line x1="90" y1="400" x2="880" y2="100" class="ideal"/>
  <polyline class="actual" points="90,400 90,400 90,400 90,400 90,400 90.1,400 90.2,400 90.3,399.9 90.6,399.8 91.2,399.5 92.5,399.1 94.9,398.1 99.9,396.2 109.7,392.5 129.5,385 169,370 228.2,347.5 307.2,317.5 425.7,272.5 583.7,212.5 820.7,122.5"/>
  <g class="point">
    <circle cx="90" cy="400" r="3.2"/><circle cx="90" cy="400" r="3.2"/><circle cx="90" cy="400" r="3.2"/><circle cx="90" cy="400" r="3.2"/>
    <circle cx="90.1" cy="400" r="3.2"/><circle cx="90.2" cy="400" r="3.2"/><circle cx="90.3" cy="399.9" r="3.2"/><circle cx="90.6" cy="399.8" r="3.2"/>
    <circle cx="91.2" cy="399.5" r="3.2"/><circle cx="92.5" cy="399.1" r="3.2"/><circle cx="94.9" cy="398.1" r="3.2"/><circle cx="99.9" cy="396.2" r="3.2"/>
    <circle cx="109.7" cy="392.5" r="3.2"/><circle cx="129.5" cy="385" r="3.2"/><circle cx="169" cy="370" r="3.2"/><circle cx="228.2" cy="347.5" r="3.2"/>
    <circle cx="307.2" cy="317.5" r="3.2"/><circle cx="425.7" cy="272.5" r="3.2"/><circle cx="583.7" cy="212.5" r="3.2"/><circle cx="820.7" cy="122.5" r="3.2"/>
  </g>

  <text x="48" y="467" class="label">Потери на округлении размера каждого ADS до кластеров (кластер NTFS: 4 096 байт)</text>
  <line x1="90" y1="480" x2="90" y2="637" class="axis"/>
  <line x1="90" y1="637" x2="880" y2="637" class="axis"/>
  <line x1="90" y1="605.6" x2="880" y2="605.6" class="grid"/>
  <line x1="90" y1="574.2" x2="880" y2="574.2" class="grid"/>
  <line x1="90" y1="542.8" x2="880" y2="542.8" class="grid"/>
  <line x1="90" y1="511.4" x2="880" y2="511.4" class="grid"/>
  <line x1="90" y1="480" x2="880" y2="480" class="grid"/>
  <text x="77" y="641" text-anchor="end" class="tick">0</text>
  <text x="77" y="610" text-anchor="end" class="tick">1 000</text>
  <text x="77" y="579" text-anchor="end" class="tick">2 000</text>
  <text x="77" y="547" text-anchor="end" class="tick">3 000</text>
  <text x="77" y="516" text-anchor="end" class="tick">4 000</text>
  <text x="77" y="484" text-anchor="end" class="tick">5 000</text>
  <text x="485" y="683" text-anchor="middle" class="label">Номер потока в серии</text>
  <text x="28" y="558" text-anchor="middle" class="label" transform="rotate(-90 28 558)">Свободное место минус данные, байт</text>
  <g>
    <rect x="101" y="539.6" width="22" height="97.4" class="bar"/><rect x="140" y="571.2" width="22" height="65.8" class="bar"/>
    <rect x="179" y="636.9" width="22" height="0.1" class="bar"/><rect x="218" y="637.0" width="22" height="0.1" class="bar"/>
    <rect x="257" y="636.9" width="22" height="0.1" class="bar"/><rect x="296" y="636.4" width="22" height="0.6" class="bar"/>
    <rect x="335" y="636.5" width="22" height="0.5" class="bar"/><rect x="374" y="637.0" width="22" height="0.1" class="bar"/>
    <rect x="413" y="636.8" width="22" height="0.2" class="bar"/><rect x="452" y="636.9" width="22" height="0.1" class="bar"/>
    <rect x="491" y="636.9" width="22" height="0.1" class="bar"/><rect x="530" y="636.7" width="22" height="0.3" class="bar"/>
    <rect x="569" y="636.9" width="22" height="0.1" class="bar"/><rect x="608" y="636.5" width="22" height="0.5" class="bar"/>
    <rect x="647" y="636.5" width="22" height="0.5" class="bar"/><rect x="686" y="636.7" width="22" height="0.3" class="bar"/>
    <rect x="725" y="637.0" width="22" height="0.1" class="bar"/><rect x="764" y="508.5" width="22" height="128.5" class="outlier"/>
    <rect x="803" y="636.8" width="22" height="0.2" class="bar"/><rect x="842" y="636.8" width="22" height="0.2" class="bar"/>
  </g>
  <text x="112" y="532" text-anchor="middle" class="tick">3 099</text>
  <text x="151" y="564" text-anchor="middle" class="tick">2 097</text>
  <text x="463" y="629" text-anchor="middle" class="tick">1</text>
  <text x="775" y="501" text-anchor="middle" class="tick">4 091</text>
  <text x="112" y="655" text-anchor="middle" class="tick">1</text>
  <text x="268" y="655" text-anchor="middle" class="tick">5</text>
  <text x="463" y="655" text-anchor="middle" class="tick">10</text>
  <text x="658" y="655" text-anchor="middle" class="tick">15</text>
  <text x="853" y="655" text-anchor="middle" class="tick">20</text>
  <rect x="285" y="710" width="14" height="14" class="bar"/><text x="306" y="722" class="tick">округление до кластера</text>
  <rect x="486" y="710" width="14" height="14" class="outlier"/><text x="507" y="722" class="tick">максимальные потери на округлении</text>
</svg>
